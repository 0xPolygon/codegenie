[review]
compositionReasoningStepDown = true

[[classification.pathRules]]
pattern = "{specs/project,specs/reviews}/**"
processingMode = "skip"
reason = "project specifications and archived review studies"

[[classification.pathRules]]
pattern = "{tests/fixtures,evals/fixtures/{repos,artifacts},evals/skill-semantics/repos}/**"
processingMode = "skip"
reason = "fixture source and saved artifacts, often intentionally defective"

[[classification.pathRules]]
pattern = "evals/{public/**/{eval.{yml,yaml},oracle.md},{fixtures,skill-semantics}/*.{yml,yaml}}"
processingMode = "skip"
reason = "eval case manifests and adjudication oracles"
