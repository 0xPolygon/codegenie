minimumReleaseAgeExclude:
  - '@earendil-works/pi-ai'

# tree-sitter-solidity mis-spells its optional-peer metadata key as
# `tree_sitter`. codegenie resolves only its published WASM through
# web-tree-sitter, so installing the native tree-sitter peer is unnecessary.
peerDependencyRules:
  ignoreMissing:
    - tree-sitter

# pnpm 11's strict dependency-build policy uses allowBuilds. esbuild is the
# only approved build: tsx/vitest need its platform binary. The denied entries
# are intentionally unused by codegenie: tree-sitter runs from published WASM,
# while the provider/protobuf/yarn postinstalls are not needed at runtime.
allowBuilds:
  esbuild: true
  '@google/genai': false
  protobufjs: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-solidity: false
  tree-sitter-typescript: false
  yarn: false

# Retain pnpm 10's compatible legacy keys for contributors on that major. Keep
# these lists equivalent to allowBuilds so both pnpm generations enforce the
# same one-approved-build policy.
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - '@google/genai'
  - protobufjs
  - tree-sitter-go
  - tree-sitter-javascript
  - tree-sitter-python
  - tree-sitter-rust
  - tree-sitter-solidity
  - tree-sitter-typescript
  - yarn
