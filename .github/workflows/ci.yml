name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.15.1"

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/actionlint.tar.gz"
          install_dir="${RUNNER_TEMP}/actionlint"
          curl --fail --silent --show-error --location \
            --output "${archive_path}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive_path}" | sha256sum --check
          mkdir -p "${install_dir}"
          tar -xzf "${archive_path}" -C "${install_dir}" actionlint
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/actionlint" -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.ignore-scripts=false

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
