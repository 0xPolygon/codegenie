# Dogfood: codegenie reviews this repo's PRs, built from the TRUSTED base.
#
# Manual only. PR reviews run locally (Luna high, full debug telemetry) so the
# team keeps every trace; this workflow is kept to smoke-test the Action, e.g.
# before a release. Trigger it with a PR comment containing the trigger phrase
# ("codegenie review").
#
# Deliberately NOT `uses: 0xPolygon/codegenie@<tag>` — the published action
# installs from npm, while this builds from source. The checkout pins the base
# revision (the default branch, for comment events), so a PR cannot modify the
# reviewer that reviews it; the PR head is fetched by `--pr` as untrusted
# data. Requires the LLM_API_KEY repository secret.
#
# All trigger authorization (phrase match, live write-permission check) lives
# in the codegenie binary — no gating logic in YAML. cancel-in-progress is
# false: comment events for the same PR queue, so an unrelated comment cannot
# cancel an in-flight run before codegenie decides skip/run.
name: codegenie review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  # provider/model[:reasoning] — the LLM_API_KEY secret is routed to this
  # provider. See models.md for the full list.
  CODEGENIE_MODEL: "anthropic/claude-opus-5:high"

concurrency:
  group: codegenie-review-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  # false: an unrelated PR comment must not cancel an in-flight manual run.
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # comment events: the default branch (trusted base)
          ref: ${{ github.event.pull_request.base.sha || '' }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Build codegenie from trusted source
        # --ignore-scripts: the build is plain tsc and tree-sitter runs from
        # prebuilt WASM, so no dependency build script is needed — and pnpm's
        # build-script policy then cannot fail the install regardless of what
        # the checked-out base revision configures.
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build

      - name: Run codegenie review
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CODEGENIE_REPORT_PATH: ${{ runner.temp }}/codegenie-report.md
          CODEGENIE_FAILURE_PATH: ${{ runner.temp }}/codegenie-failure.json
        # Bootstrap guard: the trusted-base checkout builds the BASE branch's
        # codegenie, so a PR whose base predates the github-action adapter
        # cannot run it — skip cleanly instead of failing. Once the adapter is
        # on the default branch this never fires.
        run: |
          if [ ! -d dist/github-action ]; then
            echo "github-action: base build predates the github-action adapter — skipping (bootstrap)"
            exit 0
          fi
          node dist/cli/main.js github-action --model "$CODEGENIE_MODEL"

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codegenie-report
          path: |
            ${{ runner.temp }}/codegenie-report.md
            ${{ runner.temp }}/codegenie-failure.json
          if-no-files-found: ignore
