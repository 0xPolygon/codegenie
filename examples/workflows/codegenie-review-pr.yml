# Automatic codegenie review on every PR open/update.
#
# Uses the `pull_request` event (never `pull_request_target`): fork PRs run
# without secrets and are skipped cleanly — use the comment-trigger workflow
# for fork PRs. Requires the LLM_API_KEY secret (routed to the provider named
# in `model`).
#
# Checkout pins the BASE revision: codegenie's config and skills load from
# trusted code, while the PR head is fetched by `--pr` as untrusted data.
# `cancel-in-progress` is safe here: only pushes to this same PR join the
# group, and a push makes the running review stale by definition.
name: codegenie review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: codegenie-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - uses: 0xPolygon/codegenie@v0.5.0
        with:
          model: "anthropic/claude-opus-5:high"
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          post-inline-comments: "true"
