# Comment-triggered codegenie review: write "codegenie review" on a PR.
#
# issue_comment workflows run from the default branch, so codegenie's config
# and skills come from trusted code and this lane also serves fork PRs. The
# first job runs codegenie's exact trigger matcher and live write-permission
# check. Only an authorized event can start the cancellable review job.
name: codegenie review (comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  # Customize authorization once; preflight and review consume the same values.
  CODEGENIE_TRIGGER_PHRASE: "codegenie review"
  CODEGENIE_ALLOWED_ASSOCIATIONS: "OWNER,MEMBER,COLLABORATOR"
  CODEGENIE_ALLOWED_USERS: ""

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authorize review trigger
        id: gate
        uses: 0xPolygon/codegenie@v0.4.2
        with:
          preflight-only: "true"
          trigger-phrase: ${{ env.CODEGENIE_TRIGGER_PHRASE }}
          allowed-associations: ${{ env.CODEGENIE_ALLOWED_ASSOCIATIONS }}
          allowed-users: ${{ env.CODEGENIE_ALLOWED_USERS }}

  review:
    needs: preflight
    if: ${{ needs.preflight.outputs.should-run == 'true' }}
    concurrency:
      group: codegenie-review-pr-${{ needs.preflight.outputs.pr-number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: 0xPolygon/codegenie@v0.4.2
        with:
          model: "anthropic/claude-opus-4-8:high"
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          trigger-phrase: ${{ env.CODEGENIE_TRIGGER_PHRASE }}
          allowed-associations: ${{ env.CODEGENIE_ALLOWED_ASSOCIATIONS }}
          allowed-users: ${{ env.CODEGENIE_ALLOWED_USERS }}
