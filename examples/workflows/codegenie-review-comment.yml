# Comment-triggered codegenie review: write "codegenie review" on a PR.
#
# issue_comment workflows run from the default branch, so codegenie's config
# and skills come from trusted code and this lane also serves fork PRs. All
# trigger authorization (exact phrase match, live write-permission check)
# happens inside codegenie — no gating logic in YAML.
#
# cancel-in-progress: newest event wins. Note the trade-off: any comment on
# the PR starts a run that supersedes an in-flight review of that PR before
# codegenie decides it is a skip. If your PR threads are chatty, set this to
# false (re-triggers then queue) or gate a separate ungrouped job with the
# `preflight-only` input.
name: codegenie review (comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: codegenie-review-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: 0xPolygon/codegenie@v0.4.2
        with:
          model: "anthropic/claude-opus-5:high"
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          trigger-phrase: "codegenie review"
